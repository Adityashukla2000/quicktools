name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout
      - uses: actions/checkout@v4

      # ✅ Setup Flutter (FIXED)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ✅ Dependencies
      - name: Install Dependencies
        run: flutter pub get

      # ✅ Build Web
      - name: Build Flutter Web
        run: flutter build web

      # ✅ Deploy
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QUICKTOOLS_9E935 }}
          channelId: live
          projectId: quicktools-9e935